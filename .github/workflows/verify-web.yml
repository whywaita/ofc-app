name: Web verification (vlmkit)

# Gates the Flutter web build with vlmkit: DOM integrity, touch-target size, focus order,
# click-handler inventory, and a scripted flow through the seed dialog into the game screen.
# The build has to be instrumented for the DOM to exist at all, which is what
# tools/vlmkit/serve-web.mjs does — see docs/vlmkit.md.
#
# A failing gate is a real finding, not a flake to retry: the gates are deterministic and
# key-free. If one starts failing for a reason that is not a defect, record it in
# vlmkit.gates.json (a `rules` entry or a suppression with a reason and an expiry) rather
# than relaxing the job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    name: vlmkit gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install verification tooling
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build web and run gates
        run: make verify-web

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vlmkit-reports
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
